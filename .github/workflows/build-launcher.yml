name: Build portable launcher
on:
  workflow_dispatch:
  push:
    tags: ['portable-v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      HORIZON_TELEMETRY_URL: 'off'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_NO_AUDIO: '1'
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            launcher -> target
      - name: Isolate test data and locate shader compiler
        shell: pwsh
        run: |
          foreach ($key in @('HORIZON_HOME','HORIZON_LAUNCHER_HOME','XDG_DATA_HOME','XDG_CONFIG_HOME','HORIZON_LAUNCHER_TRASH','HORIZON_LAUNCHER_CLIPBOARD','HORIZON_LAUNCHER_DESKTOP')) {
            "$key=$env:RUNNER_TEMP/$key" >> $env:GITHUB_ENV
          }
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter fxc.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler missing' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Test launcher
        run: cargo test --locked --release --manifest-path launcher/Cargo.toml
      - name: Build single executable
        shell: pwsh
        run: ./tools/build-portable.ps1 -HorizonRevision $env:GITHUB_SHA
      - name: Verify portable first-run extraction
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/HORIZON CUSTOM BY RILEXezz.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Portable startup failed' }
          $versions = Get-ChildItem (Join-Path $env:HORIZON_LAUNCHER_HOME 'versions') -Directory -Filter 'portable-*'
          if (-not $versions) { throw 'Embedded client was not installed' }
          foreach ($version in $versions) {
            foreach ($name in @('horizon-client.exe','horizon-prepare.exe','horizon-mixins.exe','.installed')) {
              if (-not (Test-Path (Join-Path $version.FullName $name))) { throw "Missing embedded file: $name" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-custom-portable
          path: dist/HORIZON CUSTOM BY RILEXezz.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/portable-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" 'dist/HORIZON CUSTOM BY RILEXezz.exe' --verify-tag --title "Horizon Custom $env:GITHUB_REF_NAME" --generate-notes
